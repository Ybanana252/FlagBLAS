    num_warps: 4
    num_stages: 4
  - META: {BLOCK_M: 256, BLOCK_N: 128, BLOCK_K: 32, NUM_WM: 2}
    num_warps: 8
    num_stages: 3
  # Deep-pipeline small-K-chunk variants; best for large-K few-expert shapes.
  - META: {BLOCK_M: 128, BLOCK_N: 256, BLOCK_K: 32, NUM_WM: 4}
    num_warps: 8
