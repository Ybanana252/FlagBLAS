# bfgemm_nt: Hygon gfx936 bfgemm NT direct kernel pool. Previously hygon had no bfgemm_nt section,
# falling back to the NVIDIA default pool (BK128/s3-6 are outside the gfx936 smem limit, so many shapes only selected suboptimal
# small tiles), the v4 official run NT large square was only 8192^3 7.18ms (sp 0.50), 16384^3 55.9ms (sp 0.93).
# NT and NN share the same general level3 kernel (only the B tile read differs: with transb=T, B is physically (n,k)),
# directly shares the bfgemm_nn pool (27 configs). 2026-09-05 official protocol (do_bench w1000/r100/
# median) verified shape by shape: (256,256,BK64,w16,s2) 8192^3 -> 4.10ms (sp 0.87),
# 16384^3 -> 32.8ms (sp 1.59), 4096x24576x8192 -> 6.30ms (sp 1.66), 8191^3 -> 9.45ms
# (sp 0.54), etc., output bit-identical to the old pool; small shapes have autotune select small-tile configs, no fallback.
bfgemm_nt: *bfgemm_nn_hygon_configs

# bfgemm_tn: Hygon gfx936 bfgemm TN direct kernel pool. Previously hygon had no bfgemm_tn section,
# falling back to the NVIDIA default pool (only 4 configs: (64,32,BK128,w8,s5)/(64,64,BK64,w4,s4)/
# (128,128,BK64,w8,s6)/(128,128,BK64,w8,s3); s5/s6 exceed the gfx936 64KB smem limit and fail to compile,
# only ~1-2 actually usable), many TN shapes could only select suboptimal tiles (v7 TN 8192^3 only 0.516 sp while
# NN same shape 0.595, and 2048-level small shapes are all below the corresponding NN tiers). TN is the same general
# level3 kernel as NN/NT (only the A tile read differs: with transa=T, A is physically (k,m)), directly shares the bfgemm_nn pool;
# libtuner selects the best per shape from the union, enlarging the pool has no regression risk (only more choices).
bfgemm_tn: *bfgemm_nn_hygon_configs

# hgemm_nn / hgemm_nt / hgemm_tn: Hygon gfx936 hgemm dedicated pool.
# Previously hygon had no hgemm_* sections and fell back to the NVIDIA default pool, so TN/TT variants had low absolute throughput
# (hgemm report 2026-09-03: 8192^3 tn ~62 / tt ~76 TFLOPS, nn 105 / nt 154).
# hgemm and bfgemm are both 2B dtype and share the same general level3 kernel and gfx936 resource constraints
# (smem/VGPR), so the initial pool directly reuses the bfgemm_*_hygon pool (that pool contains the original 9 NVIDIA configs
# as a superset, libtuner selects the best per shape, no regression risk vs the default pool). Later we can add/converge on
# real hardware via fp16-specific sweeps.
hgemm_nn: *bfgemm_nn_hygon_configs
hgemm_nt: *bfgemm_nn_hygon_configs
hgemm_tn: *bfgemm_nn_hygon_configs
