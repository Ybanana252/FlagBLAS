  # medium shapes (4096^3/1024^3) -> 128x64 w8 or 64x128 w8; tn square shapes prefer 128x128 w8 s3;
  # thin/long-N shapes (32768x1024x1024/256x8192x2048) -> 128x256 w8 or 64x64 w4.
  # v2.8 (2026-08-31): added 256x256 GROUP_M=8 (the original pool only had GROUP_M=1). GROUP_M determines
  # the L2 scheduling of tiles along the M direction: for nt/tt large shapes, measured G8 is far better than G1 (16384^3 nt direct
