bfgemm_nn: &bfgemm_nn_hygon_configs
  # v1: Hygon gfx936 bfgemm NN pool. Previously Hygon had no bfgemm_* section and fell back to the NVIDIA default pool
  # (BK=64/128, stages 3-6); on gfx936 (<96KB smem) many shapes could only select suboptimal small tiles,
  # 2048^3 NN main only ~77TF. This section = the original 9 NVIDIA configs (keeps TT variants from regressing, superset) +
  # measured hygon winning configs (BK=32/64, s2, w4-16; 2048^3 main 222.6->167us -25%,
  # 4096^3 1352->1040us -23%). libtuner selects the best per shape from the union, no regression risk.
  - META: {BLOCK_M: 64, BLOCK_N: 128, BLOCK_K: 128, GROUP_M: 8}
    num_warps: 4
    num_stages: 4
  - META: {BLOCK_M: 64, BLOCK_N: 64, BLOCK_K: 64, GROUP_M: 8}
    num_warps: 4
    num_stages: 3
  - META: {BLOCK_M: 128, BLOCK_N: 128, BLOCK_K: 64, GROUP_M: 8}
