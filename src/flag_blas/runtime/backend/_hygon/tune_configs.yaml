  # 大/方 shape (8192^3/16384^3/8192x28672x8192/2048x2048x16384) -> 256x256 w16;
  # 中 shape (4096^3/1024^3) -> 128x64 w8 或 64x128 w8; tn 方 shape 偏好 128x128 w8 s3;
  # 瘦/长 N shape (32768x1024x1024/256x8192x2048) -> 128x256 w8 或 64x64 w4。
  # v2.8 (2026-08-31): 新增 256x256 GROUP_M=8 (原池只有 GROUP_M=1)。GROUP_M 决定
  # M 方向 tile 的 L2 调度: nt/tt 大 shape 实测 G8 远优于 G1 (16384^3 nt 直连
